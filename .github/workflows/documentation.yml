name: documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'conf.py'
      - 'Pipfile'
      - 'Pipfile.lock'
      - 'Makefile'
      - 'scripts/install.sh'
      - '_static/**'
      - '_extra_html/**'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'
  pull_request_target:
    types:
      - closed

jobs:
  doc_test:
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Python version from Pipfile
        id: python-version
        run: |
          python_version="$(awk -F'"' '
            /^python_full_version[[:space:]]*=/ { print $2; exit }
            /^python_version[[:space:]]*=/ { print $2; exit }
          ' Pipfile)"
          if [[ -z "${python_version}" ]]; then
            echo "Could not find a Python version in Pipfile" >&2
            exit 1
          fi
          echo "value=${python_version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
            python-version: ${{ steps.python-version.outputs.value }}
            cache: 'pipenv'
      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python
      - run: pipenv install
      - name: Install dependencies
        run: |
          pipenv install sphinx sphinx_rtd_theme myst_parser
      - name: Sphinx build
        run: |
          make html
  final_doc_creation:
    needs: doc_test
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/primary' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
